apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: backend
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: HOST
          value: "0.0.0.0"
        - name: PORT
          value: "8000"
        - name: REQUEST_TIMEOUT
          value: "30"
        - name: AZURE_ML_ENDPOINT
          value: "https://ml.altudo.net/api/v1/endpoint/customer-churn-endpoint/score"
        - name: AZURE_ML_API_KEY
          value: "2mi7ZIDiVVOv0kcSJK0qbZvUTNGpLm2DHyHdLQLEKiVl79iUrG0kJQQJ99CHAAAAAAAAAAAAINFRAZML1eS8"
        - name: ALLOWED_ORIGINS
          value: "https://mlops.altudo.net"
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  type: ClusterIP
