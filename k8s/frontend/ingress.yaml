apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: llmops-ingress
  annotations:
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: azure-application-gateway
  rules:
    - host: llmops.altudo.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
  tls:
    - hosts:
        - llmops.altudo.net
      secretName: llmops-tls