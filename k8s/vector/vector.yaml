---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector
  labels:
    app: vector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      containers:
      - name: vector
        image: vector
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 5173
          protocol: TCP
        env:
        - name: AZURE_FOUNDRY_ENDPOINT
          value: "https://foundry-llmop.services.ai.azure.com/"
        - name: AZURE_FOUNDRY_API_KEY
          valueFrom:
            secretKeyRef:
              name: azure-foundry-api-key
              key: azure-foundry-api-key.txt
        - name: EMBEDDING_MODEL_NAME
          value: "text-embedding-3-small"
        - name: AZURE_API_VERSION
          value: "2024-12-01-preview"
        - name: AZURE_STORAGE_ACCOUNT
          value: "llmstoregs"
        - name: AZURE_STORAGE_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: azure-storage-access-key
              key: azure-storage-access-key.txt
        - name: AZURE_STORAGE_CONTAINER
          value: "llmops"
        - name: AZURE_STORAGE_PREFIX
          value: "documents/"
        - name: QDRANT_CLIENT_URL
          value: "http://qdrant.qdrant.svc.cluster.local:6333"
        - name: QDRANT_COLLECTION_NAME
          value: "margies_travel_embeddings"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        readinessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health
            port: 5173
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: vector
spec:
  type: ClusterIP
  selector:
    app: vector
  ports:
  - name: http
    port: 5173
    targetPort: 5173
    protocol: TCP
