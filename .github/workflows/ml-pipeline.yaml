name: ML Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  ml-pipeline:
    name: Train, Evaluate and Deploy ML Model
    runs-on: self-hosted

    env:
      AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
      AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
      DATASET_NAME: customer_churn.csv
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_EXPERIMENT: customer-churn
      REGISTERED_MODEL_NAME: customer-churn-model
      MODEL_ALIAS: Production
      KUBEFLOW_ENDPOINT: ${{ secrets.KUBEFLOW_ENDPOINT }}
      KUBEFLOW_EXPERIMENT_NAME: customer-churn-experiment
      KSERVE_NAMESPACE: mlops
      INFERENCE_SERVICE_NAME: customer-churn
      MIN_ACCURACY: "0.80"
      MIN_PRECISION: "0.75"
      MIN_RECALL: "0.75"
      MIN_F1: "0.75"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v3.0.0

    - name: Docker Login
      uses: docker/login-action@v4
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      
    - name: Backend Build And Push
      uses: docker/build-push-action@v7
      with:
        context: ./ml
        push: true
        no-cache: true
        tags: ${{ secrets.DOCKER_REGISTRY }}/mlflow:${{github.run_number}}

    - name: Set ML Pipeline Base Image
      shell: bash
      run: |
        echo "ML_PIPELINE_BASE_IMAGE=${{ secrets.DOCKER_REGISTRY }}/mlflow:${{ github.run_number }}" >> "$GITHUB_ENV"

    - name: Install Dependencies
      shell: bash
      working-directory: pipeline
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt   
    
    - name: Compile Kubeflow Pipeline
      shell: bash
      working-directory: pipeline
      run: |
        python compile_pipeline.py

    - name: Trigger Kubeflow Pipeline
      shell: bash
      working-directory: pipeline
      run: |
        python trigger_pipeline.py